service:
  name: gpu-agent
  env: prod
  version: v0.1.0

agent:
  node_name: ""
  heartbeat_interval: 10s
  collect_interval: 10s
  report_timeout: 5s
  enable_dcgm: true
  enable_nvidia_smi: true
  enable_mig_discovery: true
  enable_topology_discovery: true

reporter:
  mode: grpc
  http:
    endpoint: "http://gpu-api-server.gpu-system.svc.cluster.local:8080/internal/agent/report"
    timeout: 5s
  grpc:
    endpoint: "gpu-api-server.gpu-system.svc.cluster.local:18080"
    timeout: 5s

kubernetes:
  in_cluster: true
  kubeconfig: ""
  qps: 20
  burst: 50

observability:
  server:
    enabled: true
    addr: ":9094"
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""
    sample_ratio: 0.1
    insecure: true
    headers: {}
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      ca_file: ""
      insecure_skip_verify: false
      server_name: ""
  pprof:
    enabled: false
    path_prefix: "/debug/pprof"

logging:
  level: info
  format: json
  output_paths:
    - stdout
  error_output_paths:
    - stderr