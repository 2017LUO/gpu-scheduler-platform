service:
  name: gpu-controller
  env: dev
  version: v0.1.0

controller:
  workers:
    gpujob: 4
    node: 2
    pod: 4
    quota: 2
    policy: 2
  resync_period: 30s
  reconcile_timeout: 20s
  enable_allocation_recovery: true
  enable_job_status_sync: true

leader_election:
  enabled: true
  lease_name: "gpu-controller-leader"
  lease_namespace: "gpu-system"
  lease_duration: 15s
  renew_deadline: 10s
  retry_period: 2s

mysql:
  dsn: "root:123456@tcp(127.0.0.1:3306)/gpu_scheduler?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  pool_size: 20
  min_idle_conns: 5

kubernetes:
  in_cluster: false
  kubeconfig: ""
  qps: 50
  burst: 100

observability:
  metrics:
    enabled: true
    addr: ":9092"
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""
    sample_ratio: 0.1
  pprof:
    enabled: true
    addr: ":6062"

logging:
  level: info
  format: console
  output_paths:
    - stdout
  error_output_paths:
    - stderr