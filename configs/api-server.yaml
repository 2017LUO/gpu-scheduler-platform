service:
  name: gpu-api-server
  env: prod
  version: v0.1.0

server:
  http:
    addr: ":8080"
    read_timeout: 10s
    write_timeout: 15s
    idle_timeout: 60s
    shutdown_timeout: 20s

security:
  enable_authn: true
  enable_authz: true
  jwt:
    issuer: "gpu-scheduler-platform"
    secret: "change-me-in-prod"
    expire: 24h

mysql:
  dsn: "root:123456@tcp(mysql.gpu-system.svc.cluster.local:3306)/gpu_scheduler?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  addr: "redis.gpu-system.svc.cluster.local:6379"
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  pool_size: 20
  min_idle_conns: 5

observability:
  server:
    enabled: true
    addr: ":9090"
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""
    sample_ratio: 0.1
    insecure: true
    headers: {}
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      ca_file: ""
      insecure_skip_verify: false
      server_name: ""
  pprof:
    enabled: false
    path_prefix: "/debug/pprof"

logging:
  level: info
  format: json
  output_paths:
    - stdout
  error_output_paths:
    - stderr

features:
  enable_queue_api: true
  enable_policy_api: true
  enable_quota_api: true
  enable_tenant_api: true
  enable_cluster_api: true