namespaceOverride: ""

global:
  imageRegistry: local
  imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

config:
  apiServer: |
    service:
      name: gpu-api-server
      env: prod
      version: v0.1.0
    server:
      http:
        addr: ":8080"
        read_timeout: 10s
        write_timeout: 15s
        idle_timeout: 60s
        shutdown_timeout: 20s
    security:
      enable_authn: false
      enable_authz: false
      jwt:
        issuer: gpu-scheduler-platform
        secret: change-me
        expire: 24h
    mysql:
      dsn: root:123456@tcp(mysql:3306)/gpu_scheduler?charset=utf8mb4&parseTime=True&loc=Local
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 30m
      conn_max_idle_time: 10m
    redis:
      addr: redis:6379
      password: ""
      db: 0
      dial_timeout: 3s
      read_timeout: 2s
      write_timeout: 2s
      pool_size: 20
      min_idle_conns: 5
    observability:
      metrics:
        enabled: true
        path: /metrics
      tracing:
        enabled: false
        endpoint: ""
        sample_ratio: 0.1
      pprof:
        enabled: true
        path_prefix: /debug/pprof
    logging:
      level: info
      format: console
      output_paths: [stdout]
      error_output_paths: [stderr]
    features:
      enable_queue_api: true
      enable_policy_api: true
      enable_quota_api: true
      enable_tenant_api: true
      enable_cluster_api: true

  scheduler: |
    service:
      name: gpu-scheduler
      env: prod
      version: v0.1.0
    scheduler:
      schedule_interval: 2s
      max_concurrent_cycles: 4
      pending_batch_size: 50
      reservation_ttl: 30s
      bind_timeout: 15s
      enable_preemption: true
      enable_gang_scheduling: false
      enable_topology_aware: true
      enable_mig: false
    leader_election:
      enabled: true
      lease_name: gpu-scheduler-leader
      lease_namespace: gpu-system
      lease_duration: 15s
      renew_deadline: 10s
      retry_period: 2s
    mysql:
      dsn: root:123456@tcp(mysql:3306)/gpu_scheduler?charset=utf8mb4&parseTime=True&loc=Local
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 30m
      conn_max_idle_time: 10m
    redis:
      addr: redis:6379
      password: ""
      db: 0
      dial_timeout: 3s
      read_timeout: 2s
      write_timeout: 2s
      pool_size: 20
      min_idle_conns: 5
    kubernetes:
      in_cluster: true
      kubeconfig: ""
      qps: 50
      burst: 100
    observability:
      metrics:
        enabled: true
        addr: ":9091"
        path: /metrics
      tracing:
        enabled: false
        endpoint: ""
        sample_ratio: 0.1
      pprof:
        enabled: true
        addr: ":6061"
    logging:
      level: info
      format: console
      output_paths: [stdout]
      error_output_paths: [stderr]

  controller: |
    service:
      name: gpu-controller
      env: prod
      version: v0.1.0
    controller:
      workers:
        gpujob: 4
        node: 2
        pod: 4
        quota: 2
        policy: 2
      resync_period: 30s
      reconcile_timeout: 20s
      enable_allocation_recovery: true
      enable_job_status_sync: true
    leader_election:
      enabled: true
      lease_name: gpu-controller-leader
      lease_namespace: gpu-system
      lease_duration: 15s
      renew_deadline: 10s
      retry_period: 2s
    mysql:
      dsn: root:123456@tcp(mysql:3306)/gpu_scheduler?charset=utf8mb4&parseTime=True&loc=Local
      max_open_conns: 30
      max_idle_conns: 10
      conn_max_lifetime: 30m
      conn_max_idle_time: 10m
    redis:
      addr: redis:6379
      password: ""
      db: 0
      dial_timeout: 3s
      read_timeout: 2s
      write_timeout: 2s
      pool_size: 20
      min_idle_conns: 5
    kubernetes:
      in_cluster: true
      kubeconfig: ""
      qps: 50
      burst: 100
    observability:
      metrics:
        enabled: true
        addr: ":9092"
        path: /metrics
      tracing:
        enabled: false
        endpoint: ""
        sample_ratio: 0.1
      pprof:
        enabled: true
        addr: ":6062"
    logging:
      level: info
      format: console
      output_paths: [stdout]
      error_output_paths: [stderr]

  webhook: |
    service:
      name: gpu-webhook
      env: prod
      version: v0.1.0
    server:
      https:
        addr: ":9443"
        cert_file: /tls/tls.crt
        key_file: /tls/tls.key
        read_timeout: 10s
        write_timeout: 10s
        shutdown_timeout: 20s
    webhook:
      enable_mutating: true
      enable_validating: true
      failure_policy: Fail
      side_effects: None
    kubernetes:
      in_cluster: true
      kubeconfig: ""
      qps: 20
      burst: 50
    observability:
      metrics:
        enabled: true
        addr: ":9093"
        path: /metrics
      tracing:
        enabled: false
        endpoint: ""
        sample_ratio: 0.1
      pprof:
        enabled: false
        addr: ":6063"
    logging:
      level: info
      format: console
      output_paths: [stdout]
      error_output_paths: [stderr]

  agent: |
    service:
      name: gpu-agent
      env: prod
      version: v0.1.0
    agent:
      node_name: ""
      heartbeat_interval: 10s
      collect_interval: 10s
      report_timeout: 5s
      enable_dcgm: false
      enable_nvidia_smi: true
      enable_mig_discovery: true
      enable_topology_discovery: true
    reporter:
      mode: http
      http:
        endpoint: http://gpu-scheduler-platform-api-server:8080/internal/agent/report
        timeout: 5s
      grpc:
        endpoint: ""
        timeout: 5s
    kubernetes:
      in_cluster: true
      kubeconfig: ""
      qps: 20
      burst: 50
    observability:
      metrics:
        enabled: true
        addr: ":9094"
        path: /metrics
      tracing:
        enabled: false
        endpoint: ""
        sample_ratio: 0.1
      pprof:
        enabled: false
        addr: ":6064"
    logging:
      level: info
      format: console
      output_paths: [stdout]
      error_output_paths: [stderr]

images:
  apiServer:
    repository: gpu-api-server
    tag: dev
  scheduler:
    repository: gpu-scheduler
    tag: dev
  controller:
    repository: gpu-controller
    tag: dev
  webhook:
    repository: gpu-webhook
    tag: dev
  agent:
    repository: gpu-agent
    tag: dev

apiServer:
  replicas: 1
  service:
    type: ClusterIP
    port: 8080

scheduler:
  replicas: 1

controller:
  replicas: 1

webhook:
  replicas: 1
  service:
    type: ClusterIP
    port: 9443

agent:
  updateStrategy: RollingUpdate

mysql:
  enabled: false

redis:
  enabled: false

tls:
  createSecret: false
  existingSecret: gpu-webhook-tls