{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-scheduler-platform.serviceAccountName" . }}
    namespace: {{ include "gpu-scheduler-platform.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-scheduler-platform.fullname" . }}
{{- end }}