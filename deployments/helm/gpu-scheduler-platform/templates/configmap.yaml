apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}-config
  namespace: {{ include "gpu-scheduler-platform.namespace" . }}
data:
  api-server.yaml: |
{{ .Values.config.apiServer | indent 4 }}
  scheduler.yaml: |
{{ .Values.config.scheduler | indent 4 }}
  controller.yaml: |
{{ .Values.config.controller | indent 4 }}
  webhook.yaml: |
{{ .Values.config.webhook | indent 4 }}
  agent.yaml: |
{{ .Values.config.agent | indent 4 }}