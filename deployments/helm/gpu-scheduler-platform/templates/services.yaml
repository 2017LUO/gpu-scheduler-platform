apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}-api-server
  namespace: {{ include "gpu-scheduler-platform.namespace" . }}
spec:
  type: {{ .Values.apiServer.service.type }}
  selector:
    app: {{ include "gpu-scheduler-platform.fullname" . }}-api-server
  ports:
    - name: http
      port: {{ .Values.apiServer.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}-webhook
  namespace: {{ include "gpu-scheduler-platform.namespace" . }}
spec:
  type: {{ .Values.webhook.service.type }}
  selector:
    app: {{ include "gpu-scheduler-platform.fullname" . }}-webhook
  ports:
    - name: https
      port: {{ .Values.webhook.service.port }}
      targetPort: 9443