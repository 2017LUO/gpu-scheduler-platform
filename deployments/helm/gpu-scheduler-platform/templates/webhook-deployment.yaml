apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-scheduler-platform.fullname" . }}-webhook
  namespace: {{ include "gpu-scheduler-platform.namespace" . }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      app: {{ include "gpu-scheduler-platform.fullname" . }}-webhook
  template:
    metadata:
      labels:
        app: {{ include "gpu-scheduler-platform.fullname" . }}-webhook
    spec:
      serviceAccountName: {{ include "gpu-scheduler-platform.serviceAccountName" . }}
      containers:
        - name: webhook
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.images.webhook.repository }}:{{ .Values.images.webhook.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["-config", "/app/configs/webhook.yaml"]
          ports:
            - containerPort: 9443
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "gpu-scheduler-platform.fullname" . }}-config
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}